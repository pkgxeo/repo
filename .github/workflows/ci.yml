name: Build & Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one build+deploy at a time so the Pages site stays consistent.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build every package submodule inside the nested `list` submodule for each
  # target, upload each platform/arch as an artifact.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install nightly Rust (build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-

      - name: Install Linux arm64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build packages
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          # list the package dirs inside the `list` submodule (exclude non-packages)
          NAMES=$(ls -d list/*/ | sed 's|list/||; s|/||' | grep -v -E '^(\.github|\.git)$' | sort)
          if [ -z "$NAMES" ]; then
            echo "::error:: no package directories found in list/"
            exit 1
          fi
          mkdir -p stage
          for name in $NAMES; do
            echo "Building $name for ${{ matrix.target }}"
            (cd "list/$name" && cargo build --release --target "${{ matrix.target }}")
            ext=""
            if [ "${{ matrix.platform }}" = "windows" ]; then ext=".exe"; fi
            bin="list/$name/target/${{ matrix.target }}/release/$name$ext"
            if [ -f "$bin" ]; then
              cp "$bin" "stage/$name-${{ matrix.arch }}-${{ matrix.platform }}$ext"
            else
              echo "::error:: no binary produced for $name"
              exit 1
            fi
          done

      - name: Install UPX (non-windows)
        if: matrix.platform != 'windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y upx || true
          else
            brew install upx || true
          fi

      - name: Compress binaries with UPX
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          for f in stage/*; do
            [ -f "$f" ] || continue
            chmod +x "$f"
            upx --best "$f" || upx --lzma "$f" || true
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: stage/*
          if-no-files-found: error

  # Generate the GitHub Pages index from the built package metadata and upload
  # the consolidated site for deployment.
  site:
    name: Generate Pages site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Collect metadata
        run: |
          mkdir -p site/pkg
          for d in list/*/; do
            pkgdir="${d%/}"
            case "$pkgdir" in */.github|*/.git) continue ;; esac
            if [ -d "$pkgdir/pkg" ]; then
              cp "$pkgdir"/pkg/*.toml site/pkg/ 2>/dev/null || true
            fi
          done

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: site/bin
          merge-multiple: true

      - name: Generate multi-page site
        shell: bash
        run: |
          bash ./site.sh list site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
